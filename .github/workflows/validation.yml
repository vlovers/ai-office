name: AI Office validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-office-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: TypeScript, tests, smoke, build and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: HTTP/SSE smoke tests
        run: npm run test:smoke
      - name: Production build
        run: npm run build
      - name: Temporary formatter diagnostics
        run: |
          npx prettier --write .github/dependabot.yml .github/ISSUE_TEMPLATE/bug_report.yml .github/ISSUE_TEMPLATE/feature_request.yml CHANGELOG.md
          for file in .github/dependabot.yml .github/ISSUE_TEMPLATE/bug_report.yml .github/ISSUE_TEMPLATE/feature_request.yml CHANGELOG.md; do
            echo "FORMAT_BEGIN:$file"
            base64 -w0 "$file"
            echo
            echo "FORMAT_END:$file"
          done
      - name: Formatting
        run: npm run format:check
      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser smoke (deterministic fixtures)
        run: npm run test:browser
