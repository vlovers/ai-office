name: AI Office validation

on:
  pull_request:
    # Validate every PR base, including security/** and future stacked branches.
    # Branch filters silently suppress checks for otherwise valid draft PRs.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-office-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: TypeScript, tests, smoke, build and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Delivery security lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Offline integration stack audit regressions
        run: node --test tests/pr-stack-audit.node.mjs
      - name: CI trigger and security policy regressions
        run: node --test tests/ci-trigger-policy.node.mjs
      - name: HTTP/SSE smoke tests
        run: npm run test:smoke
      - name: Production build
        run: npm run build
      - name: Formatting
        id: formatting
        run: npm run format:check
      - name: Show formatting diff on failure
        if: failure() && steps.formatting.outcome == 'failure'
        run: |
          npx prettier --write . > /dev/null
          git diff -- .
      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser smoke (deterministic fixtures)
        run: npm run test:browser

      - name: Office V4 scene and state browser smoke (no model calls)
        run: npm run test:browser:office
        env:
          AI_OFFICE_BROWSER_ARTIFACTS: ${{ runner.temp }}/office-v4

      - name: Upload office screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: office-v4-browser
          path: ${{ runner.temp }}/office-v4
          if-no-files-found: ignore
          retention-days: 7

      - name: Isolated write browser smoke (no model calls)
        run: npm run test:browser:write

      - name: Agent Studio browser and restart smoke (no model calls)
        run: npm run test:browser:studio

  native-sandbox:
    name: Native Codex filesystem policy (no inference)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Native read-only and isolated-write policy
        run: npm run test:sandbox
      - name: Reviewer, QA, workflow recovery and security integration (native sandbox, no inference)
        run: npm run test:workflow:native
      - name: Build production dashboard
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Coder to Reviewer to QA browser approval journey (native sandbox, no inference)
        run: npm run test:browser:workflow
        env:
          AI_OFFICE_BROWSER_ARTIFACTS: ${{ runner.temp }}/workflow-browser
      - name: Upload workflow browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workflow-browser
          path: ${{ runner.temp }}/workflow-browser
          if-no-files-found: ignore
          retention-days: 7
