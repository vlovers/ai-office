name: AI Office validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-office-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: TypeScript, tests, smoke, build and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: HTTP/SSE smoke tests
        run: npm run test:smoke
      - name: Production build
        run: npm run build
      - name: Formatting
        run: npm run format:check
      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Browser smoke (deterministic fixtures)
        run: npm run test:browser

      - name: Isolated write browser smoke (no model calls)
        run: npm run test:browser:write

  native-sandbox:
    name: Native Codex filesystem policy (no inference)
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Native read-only and isolated-write policy
        run: npm run test:sandbox
