name: v0.7 temporary formatting
on:
  push:
    branches:
      - feat/v07-workflow-persistence
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format only v0.7 files
        run: npx prettier --write src/server/workflows.ts tests/workflows.test.ts
      - name: Commit deterministic formatting
        run: |
          if ! git diff --quiet -- src/server/workflows.ts tests/workflows.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/server/workflows.ts tests/workflows.test.ts
            git commit -m "style: format v0.7 workflow implementation and tests"
            git push origin HEAD:feat/v07-workflow-persistence
          fi
