name: Office format once
on:
  push:
    branches: [feat/office-experience-v2]
    paths:
      - .github/workflows/office-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/web/main.tsx src/web/pixel-art.tsx src/web/styles.css tests/office-scene.test.ts
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/web/main.tsx src/web/pixel-art.tsx src/web/styles.css tests/office-scene.test.ts
          git commit -m "style(office): format activity and lifecycle views"
          git push origin HEAD:feat/office-experience-v2
