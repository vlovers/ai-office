name: Format workflow restart test
on:
  push:
    branches: [feat/v07-workflow-persistence]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/workflows.test.ts
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/workflows.test.ts
            git commit -m "style: format TaskManager restart regression"
            git push origin HEAD:feat/v07-workflow-persistence
          fi
