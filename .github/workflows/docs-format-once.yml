name: One-time docs formatting
on:
  push:
    branches: [docs/v060-agent-studio-roadmap]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write ROADMAP.md docs/V0_6_AGENT_STUDIO_PROMPT.md
      - name: Commit formatted documents
        run: |
          if ! git diff --quiet -- ROADMAP.md docs/V0_6_AGENT_STUDIO_PROMPT.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ROADMAP.md docs/V0_6_AGENT_STUDIO_PROMPT.md
            git commit -m "docs: format v0.6 roadmap and implementation prompt"
            git push
          fi
