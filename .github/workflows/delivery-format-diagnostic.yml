name: Delivery format diagnostic (temporary)
on:
  pull_request:
    paths:
      - 'tests/delivery-git-transfer-reconciliation.test.ts'
      - '.github/workflows/delivery-format-diagnostic.yml'
permissions:
  contents: read
jobs:
  prettier-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Show exact formatting changes
        run: |
          npx prettier --write tests/delivery-git-transfer-reconciliation.test.ts
          git diff -- tests/delivery-git-transfer-reconciliation.test.ts
