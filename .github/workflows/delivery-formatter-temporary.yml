name: Temporary delivery branch formatting
on:
  push:
    branches:
      - feat/delivery-receipt-validation-2026-10-24
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'vlovers/ai-office' && github.actor == 'vlovers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npx prettier --write src/server/delivery-publication-reconciliation.ts
      - name: Commit formatting only
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/server/delivery-publication-reconciliation.ts
            git commit -m "style: apply Prettier to reconciliation"
            git push origin HEAD:feat/delivery-receipt-validation-2026-10-24
          fi
