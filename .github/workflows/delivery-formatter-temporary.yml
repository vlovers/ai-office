name: Temporary delivery branch formatting
on:
  push:
    branches:
      - feat/delivery-publication-pipeline-2026-10-24
permissions:
  contents: write
jobs:
  format:
    if: github.repository == 'vlovers/ai-office' && github.actor == 'vlovers'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: npx prettier --write docs/DELIVERY_PUBLICATION_PIPELINE.md src/server/delivery-publication-reconciliation.ts src/server/delivery-publication-service.ts tests/delivery-github-readonly.test.ts tests/delivery-publication-github-recovery.test.ts tests/delivery-publication-pagination.test.ts tests/delivery-publication-service.test.ts
      - name: Commit formatting only
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/DELIVERY_PUBLICATION_PIPELINE.md src/server/delivery-publication-reconciliation.ts src/server/delivery-publication-service.ts tests/delivery-github-readonly.test.ts tests/delivery-publication-github-recovery.test.ts tests/delivery-publication-pagination.test.ts tests/delivery-publication-service.test.ts
            git commit -m "style: apply Prettier to delivery pipeline"
            git push origin HEAD:feat/delivery-publication-pipeline-2026-10-24
          fi
