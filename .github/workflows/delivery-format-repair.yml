name: Delivery approval formatting repair

on:
  push:
    branches:
      - feat/delivery-durable-operator-approval-2026-10-24
    paths:
      - .github/workflows/delivery-format-repair.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'vlovers/ai-office'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format only approval tests
        run: npx prettier --write tests/delivery-publication-approval.test.ts tests/delivery-publication-operator-pipeline.test.ts
      - name: Commit formatted tests to the PR branch
        run: |
          if ! git diff --quiet -- tests/delivery-publication-approval.test.ts tests/delivery-publication-operator-pipeline.test.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/delivery-publication-approval.test.ts tests/delivery-publication-operator-pipeline.test.ts
            git commit -m "style(delivery): apply Prettier to operator approval tests"
            git push origin HEAD:feat/delivery-durable-operator-approval-2026-10-24
          fi
