name: Feature request
description: Propose an improvement to AI Office
title: 'feat: '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and permission implications
      description: Explain any file writes, network access, credentials or approval flows
